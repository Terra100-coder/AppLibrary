<nav class="app-nav" [class.menu-open]="isNavOpen">
  <a class="brand" routerLink="/dashboard" (click)="closeNav()">
    <span class="brand-icon pi pi-book"></span>
    <span>BibTèque</span>
  </a>

  <button
    class="nav-toggle"
    type="button"
    [attr.aria-label]="isNavOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
    [attr.aria-expanded]="isNavOpen"
    aria-controls="primary-navigation"
    (click)="toggleNav()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="nav-links" id="primary-navigation">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeNav()">Dashboard</a>
    <a routerLink="/books" routerLinkActive="active" (click)="closeNav()">Livres</a>
    <a routerLink="/users" routerLinkActive="active" (click)="closeNav()">Utilisateurs</a>
    <a routerLink="/emprunts" routerLinkActive="active" (click)="closeNav()">Emprunts</a>
  </div>
</nav>

<main class="app-shell">
  <router-outlet></router-outlet>
</main>
